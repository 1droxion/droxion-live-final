name: Apply Claude LIVE Fix

on:
  push:
    branches: [temp-export-source-zip]
    paths:
      - '.github/workflows/apply-claude-live-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply isolated LIVE navigation handoff fix
        shell: bash
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path

          p = Path('src/LiveFirstApp.jsx')
          s = p.read_text()
          s = s.replace("  const [tab, setTab] = useState('live');\n", "  const [tab, setTab] = useState('live');\n  const [goLiveSignal, setGoLiveSignal] = useState(0);\n", 1)
          s = s.replace("      window.setTimeout(() => document.querySelector('.liveGoButton')?.click(), 80);", "      setGoLiveSignal(value => value + 1);", 1)
          s = s.replace("    window.setTimeout(() => document.querySelector('.liveGoButton')?.click(), 80);", "    setGoLiveSignal(value => value + 1);", 1)
          old = "  let content = <><HomeDiscoveryControls query={searchQuery} /><LiveExperience currentUserId={user?.id} coins={coins} onCoinsChanged={value => setCoins(Number(value || 0))} onOpenWallet={() => setWalletOpen(true)} onImmersiveChange={setImmersiveLive} /></>;"
          new = "  let content = <><HomeDiscoveryControls query={searchQuery} /><LiveExperience currentUserId={user?.id} coins={coins} onCoinsChanged={value => setCoins(Number(value || 0))} onOpenWallet={() => setWalletOpen(true)} onImmersiveChange={setImmersiveLive} autoOpenGoLive={goLiveSignal} /></>;"
          if old not in s:
              raise SystemExit('LiveFirstApp content mount marker not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('src/LiveExperienceScale.jsx')
          s = p.read_text()
          old = "export default function LiveExperienceScale({ currentUserId, coins = 0, onCoinsChanged, onOpenWallet, onImmersiveChange }) {"
          new = "export default function LiveExperienceScale({ currentUserId, coins = 0, onCoinsChanged, onOpenWallet, onImmersiveChange, autoOpenGoLive = 0 }) {"
          if old not in s:
              raise SystemExit('LiveExperienceScale signature marker not found')
          s = s.replace(old, new, 1)
          marker = "  const immersive = Boolean(sessionId);\n\n"
          insert = "  const immersive = Boolean(sessionId);\n\n  const autoOpenGoLiveHandled = useRef(0);\n  useEffect(() => {\n    if (!autoOpenGoLive || autoOpenGoLive === autoOpenGoLiveHandled.current) return;\n    autoOpenGoLiveHandled.current = autoOpenGoLive;\n    if (!isHostRoom) openGoLiveSetup();\n  }, [autoOpenGoLive, isHostRoom]);\n\n"
          if marker not in s:
              raise SystemExit('LiveExperienceScale immersive marker not found')
          s = s.replace(marker, insert, 1)
          p.write_text(s)
          PY

          git diff --check
          grep -q "autoOpenGoLive={goLiveSignal}" src/LiveFirstApp.jsx
          grep -q "autoOpenGoLive = 0" src/LiveExperienceScale.jsx

      - name: Run LIVE reliability tests
        run: node --test tests/liveReliability.test.js

      - name: Commit fix to main
        shell: bash
        run: |
          set -e
          git config user.name "1droxion"
          git config user.email "patelsuchitbhai@gmail.com"
          git add src/LiveExperienceScale.jsx src/LiveFirstApp.jsx
          git commit -m "Apply Claude LIVE navigation handoff fix"
          git push origin HEAD:main
