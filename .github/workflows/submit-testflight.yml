name: Submit to TestFlight (upload IPA artifact)
on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Direct URL to App.ipa artifact from Codemagic"
        required: true

jobs:
  upload:
    runs-on: macos-14
    steps:
      - name: Download IPA
        run: |
          curl -L "$IPA_URL" -o App.ipa
          ls -lh App.ipa
        env:
          IPA_URL: ${{ github.event.inputs.ipa_url }}

      - name: Show Xcode / Transporter versions
        run: |
          xcodebuild -version || true
          /usr/bin/xcrun iTMSTransporter -version || true

      - name: Install fastlane
        run: sudo gem install fastlane --no-document

      - name: Create api_key.json from secrets
        shell: bash
        run: |
          ESCAPED_PEM=$(printf '%s' "$APP_STORE_CONNECT_API_KEY" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')
          printf '{"key_id":"%s","issuer_id":"%s","key":%s,"in_house":false}\n' \
            "$APP_STORE_CONNECT_KEY_ID" "$APP_STORE_CONNECT_ISSUER_ID" "$ESCAPED_PEM" > api_key.json
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}

      - name: Upload with fastlane pilot
        shell: bash
        run: |
          set -e
          ARGS=(--ipa App.ipa --api_key_path api_key.json --skip_waiting_for_build_processing true --verbose)
          if [ -n "${APP_STORE_CONNECT_PROVIDER:-}" ]; then
            ARGS+=(--itc_provider "$APP_STORE_CONNECT_PROVIDER")
          fi
          fastlane pilot upload "${ARGS[@]}"
        env:
          APP_STORE_CONNECT_PROVIDER: ${{ secrets.APP_STORE_CONNECT_PROVIDER }}
