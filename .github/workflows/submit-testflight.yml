name: Submit to TestFlight (upload IPA artifact)

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Direct URL to App.ipa artifact (public link)"
        required: true

jobs:
  upload:
    runs-on: macos-14
    steps:
      - name: Download IPA (public URL required)
        env:
          IPA_URL: ${{ github.event.inputs.ipa_url }}
        run: |
          set -e
          curl -L --fail --retry 5 "$IPA_URL" -o App.ipa
          ls -lh App.ipa
          file App.ipa

      - name: Verify IPA zip
        run: unzip -t App.ipa >/dev/null

      - name: Show Xcode / Transporter versions
        run: |
          xcodebuild -version || true
          /usr/bin/xcrun iTMSTransporter -version || true

      - name: Upload with iTMSTransporter (API key)
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          PROVIDER: ${{ secrets.APP_STORE_CONNECT_PROVIDER }}
        run: |
          set -e
          /usr/bin/xcrun iTMSTransporter \
            -m upload \
            -assetFile App.ipa \
            -apiKey "$APP_STORE_CONNECT_KEY_ID" \
            -apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
            -v informational ${PROVIDER:+-itc_provider "$PROVIDER"}
