name: Export Droxion Source ZIP

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-source-zip.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Create source archive
        run: |
          zip -r droxion-live-final-source.zip . \
            -x '.git/*' 'node_modules/*' 'dist/*' 'android/.gradle/*' 'android/app/build/*'
          split -b 300M droxion-live-final-source.zip droxion-live-final-source.zip.part-

      - name: Upload part aa
        uses: actions/upload-artifact@v4
        with:
          name: droxion-source-part-aa
          path: droxion-live-final-source.zip.part-aa
          if-no-files-found: error

      - name: Upload part ab
        uses: actions/upload-artifact@v4
        with:
          name: droxion-source-part-ab
          path: droxion-live-final-source.zip.part-ab
          if-no-files-found: error

      - name: Upload part ac
        uses: actions/upload-artifact@v4
        with:
          name: droxion-source-part-ac
          path: droxion-live-final-source.zip.part-ac
          if-no-files-found: error
