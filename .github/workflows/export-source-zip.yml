name: Export Droxion Source ZIP

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-source-zip.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Create source archive
        run: |
          zip -r droxion-live-final-source.zip . \
            -x '.git/*' 'node_modules/*' 'dist/*' 'android/.gradle/*' 'android/app/build/*'

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: droxion-live-final-source
          path: droxion-live-final-source.zip
          if-no-files-found: error
