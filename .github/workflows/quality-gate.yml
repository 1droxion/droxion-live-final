name: Droxion Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-build:
    name: Web build and release checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run Droxion quality gate
        run: npm run quality-gate

      - name: Verify required release files
        run: |
          set -e
          test -f capacitor.config.json
          test -f codemagic.yaml
          test -f AGENTS.md
          test -d dist
          test -n "$(find dist -maxdepth 2 -type f -print -quit)"

      - name: Guard against tracked secret files
        shell: bash
        run: |
          set -e
          tracked_secret_files="$(git ls-files | grep -E '(^|/)\.env($|\.)|\.(pem|key|p8|p12|pfx|jks|keystore)$|(^|/)(credentials|secrets)([-_.].*)?\.json$|service[-_]?account.*\.json$' || true)"
          if [ -n "$tracked_secret_files" ]; then
            echo 'High-risk secret or credential file is tracked:' >&2
            echo "$tracked_secret_files" >&2
            exit 1
          fi

      - name: Guard against obvious tracked credentials
        shell: bash
        run: |
          set -e
          if git grep -nE 'BEGIN (RSA|EC|OPENSSH|PRIVATE) KEY' -- ':!package-lock.json'; then
            echo 'Potential private key found in tracked files.' >&2
            exit 1
          fi
          if git grep -nE '(SUPABASE_SERVICE_ROLE_KEY|SUPABASE_SERVICE_ROLE|PAYPAL_CLIENT_SECRET|TROLLEY_SECRET_KEY|LIVEKIT_API_SECRET|GOOGLE_PLAY_SERVICE_ACCOUNT_JSON|APP_STORE_CONNECT_PRIVATE_KEY)[[:space:]]*[:=][[:space:]]*["'"']?[^$[:space:]{}]+' -- ':!package-lock.json' ':!*.md' ':!*.yml' ':!*.yaml'; then
            echo 'Potential hard-coded production credential found in tracked source.' >&2
            exit 1
          fi

  android-build:
    name: Android debug build validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate generated Android app
        run: npm run android:validate

      - name: Build and inspect unsigned release AAB
        run: |
          set -e
          (
            cd android
            ./gradlew bundleRelease --stacktrace
          )
          AAB="$(find android/app/build/outputs/bundle/release -name '*.aab' -print -quit)"
          test -n "$AAB"
          if unzip -Z1 "$AAB" | grep -qi '20250520'; then
            echo 'Legacy 20250520 demo video found in Android App Bundle.' >&2
            exit 1
          fi
          echo "Android AAB bytes: $(stat -c %s "$AAB")"
          du -h "$AAB"
