workflows:
  ios-capacitor:
    name: Droxion iOS Build
    max_build_duration: 60

    environment:
      node: 20
      xcode: 15.4
      cocoapods: default
      vars:
        APP_NAME: Droxion
        BUNDLE_ID: com.droxion.app
        WEB_DIR: dist
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.droxion.app

    cache:
      cache_paths:
        - ~/.npm
        - ~/Library/Caches/CocoaPods
        - $CM_BUILD_DIR/ios/Pods

    scripts:
      - name: Show versions
        script: |
          node -v
          npm -v
          pod --version
          xcodebuild -version

      - name: Install dependencies (robust; keep optional deps)
        script: |
          set -e
          if npm ci --no-audit --no-fund; then
            echo "npm ci OK"
          else
            echo "npm ci failed → fallback"
            rm -rf node_modules
            mv package-lock.json package-lock.ci.bak || true
            npm install --legacy-peer-deps
          fi

      - name: Build web app
        script: |
          npm rebuild rollup -f || true
          npm run build

      # ✅ Make sure a Capacitor config exists and iOS project actually gets created.
      - name: Generate iOS project (Capacitor)
        script: |
          set -e
          npm i -D @capacitor/cli
          npm i @capacitor/core @capacitor/ios

          # Create a minimal config if repo doesn't have one
          if [ ! -f capacitor.config.ts ] && [ ! -f capacitor.config.json ]; then
            cat > capacitor.config.ts <<EOF
            export default {
              appId: "${BUNDLE_ID}",
              appName: "${APP_NAME}",
              webDir: "${WEB_DIR}",
              bundledWebRuntime: false
            };
            EOF
          fi

          # Initialize only if not initialized
          if ! npx cap doctor >/dev/null 2>&1; then
            npx cap init "${APP_NAME}" "${BUNDLE_ID}" --web-dir="${WEB_DIR}" --npm-client=npm
          fi

          # Ensure iOS platform is present
          if [ ! -d ios ]; then
            npx cap add ios
          fi

          # Sync web assets & native plugins
          npx cap copy ios
          npx cap sync ios

          # Verify ios/App exists; fail early if not
          test -d ios/App || (echo "❌ ios/App was not generated. Check Capacitor config." && exit 1)

          # Usage descriptions (idempotent)
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string Camera is used to take photos for chat." ios/App/App/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string Microphone is used for voice input." ios/App/App/Info.plist || true

      # ✅ Enter the right directory even if structure differs
      - name: Install CocoaPods
        script: |
          set -e
          if [ -d ios/App ]; then
            cd ios/App
          elif [ -d ios ]; then
            cd ios
          else
            echo "❌ iOS project folder not found."
            exit 1
          fi
          pod install --repo-update

      - name: Bump build number
        script: |
          if [ -d ios/App ]; then cd ios/App; else cd ios; fi
          agvtool new-version -all $BUILD_NUMBER || true

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace "ios/App/App.xcworkspace" \
            --scheme "App" \
            --archive-configuration Release \
            --archive-flags="-destination generic/platform=iOS" \
            --team-id "$APP_STORE_CONNECT_TEAM_ID"

    artifacts:
      - build/ios/ipa/*.ipa
      - ~/Library/Developer/Xcode/DerivedData/**/Build/**/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_API_KEY
        key_id: $APP_STORE_CONNECT_KEY_ID
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false
