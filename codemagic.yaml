workflows:
  ios-capacitor:
    name: Droxion iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m4

    integrations:
      app_store_connect: codemagic_key   # <- your integration name

    environment:
      groups:
        - Add
      vars:
        APP_NAME: ${APP_NAME:-Droxion}
        BUNDLE_ID: ${BUNDLE_ID:-com.droxion.app}
        WEB_DIR: ${WEB_DIR:-dist}
      xcode: 15.4
      node: 20
      cocoapods: default
      ios_signing:
  distribution_type: app_store
  bundle_identifier: com.droxion.app
    cache:
      cache_paths:
        - ~/.npm
        - ~/Library/Caches/CocoaPods
        - ios/Pods

    scripts:
      - name: Sanity check env
        script: |
          echo "APP_NAME=$APP_NAME"
          echo "BUNDLE_ID=$BUNDLE_ID"
          echo "WEB_DIR=$WEB_DIR"

      - name: Install dependencies
        script: npm ci

      - name: Build web app
        script: npm run build

      - name: Ensure Capacitor iOS project exists
        script: |
          npm i -D @capacitor/cli
          if ! npx cap ls | grep -q "Capacitor"; then
            npx cap init "$APP_NAME" "$BUNDLE_ID" --web-dir="$WEB_DIR" --npm-client=npm --yes
          fi
          if [ ! -d ios ]; then
            npx cap add ios
          fi

      - name: Force bundle id in Capacitor config (ts/json/js)
        script: |
          for f in capacitor.config.ts capacitor.config.json capacitor.config.js; do
            [ -f "$f" ] || continue
            sed -i '' "s/appId: *['\"][^'\"]*['\"]/appId: '$BUNDLE_ID'/g" "$f" || true
            sed -i '' "s/\"appId\" *: *\"[^\"]*\"/\"appId\": \"$BUNDLE_ID\"/g" "$f" || true
          done

      - name: Sync web build into iOS project
        script: |
          npx cap sync ios
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $BUNDLE_ID" ios/App/App/Info.plist || true
          # also update Xcode build setting (PRODUCT_BUNDLE_IDENTIFIER) in project file
          perl -pi -e "s/PRODUCT_BUNDLE_IDENTIFIER = [^;]*/PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID/g" ios/App/App.xcodeproj/project.pbxproj || true
          agvtool new-version -all ${BUILD_NUMBER:-1} || true

      - name: Use automatic signing profiles
        script: xcode-project use-profiles

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "ios/App/App.xcodeproj" \
            --scheme "${IOS_SCHEME:-App}" \
            --archive-path "$CM_BUILD_DIR/ios_archive.xcarchive"

    artifacts:
      - build/ios/ipa/*.ipa
      - $CM_BUILD_DIR/ios_archive.xcarchive

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true