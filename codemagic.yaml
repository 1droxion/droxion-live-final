workflows:
  ios-capacitor:
    name: Droxion iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m4   # ✅ Use faster M4 machines

    environment:
      groups:
        - appstore_credentials   # Make sure this group exists in Codemagic UI
      vars:
        APP_NAME: Droxion
        WEB_DIR: dist
        BUNDLE_ID: com.droxion.app
      node: 20
      xcode: 15.4               # ✅ Supported Xcode version
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.droxion.app

    cache:
      cache_paths:
        - ~/.npm
        - ~/Library/Caches/CocoaPods

    scripts:
      - name: Install dependencies (fix rollup issues)
        script: |
          npm ci || npm install
          npm rebuild rollup --ignore-scripts || true

      - name: Build web app (Vite)
        script: |
          chmod +x node_modules/.bin/vite || true
          npm run build

      - name: Add Capacitor iOS project if missing
        script: |
          npx cap sync ios

      - name: Update bundle id in iOS project
        script: |
          npx cap sync ios --inline

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_identifier: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID