workflows:
  ios-capacitor:
    name: Droxion iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m4

    # Use the App Store Connect key you added in Codemagic → Team → Integrations
    integrations:
      app_store_connect: codemagic_key   # <-- CHANGE to your exact integration name

    environment:
      groups:
        - Add            # contains: APP_NAME, BUNDLE_ID, WEB_DIR (and anything else you added)
      xcode: 15.4
      node: 20
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: $BUNDLE_ID   # IMPORTANT: no ${...:-...}

    cache:
      cache_paths:
        - ~/.npm
        - ~/Library/Caches/CocoaPods
        - ios/Pods

    scripts:
      - name: Sanity check required variables
        script: |
          echo "APP_NAME=$APP_NAME"
          echo "BUNDLE_ID=$BUNDLE_ID"
          echo "WEB_DIR=$WEB_DIR"
          if [ -z "$APP_NAME" ] || [ -z "$BUNDLE_ID" ] || [ -z "$WEB_DIR" ]; then
            echo "❌ Missing one of APP_NAME / BUNDLE_ID / WEB_DIR. Check Codemagic → Settings → Environment variables (group 'Add')."
            exit 1
          fi

      - name: Install dependencies
        script: npm ci

      - name: Build web app
        script: npm run build

      - name: Ensure Capacitor iOS project exists
        script: |
          npm i -D @capacitor/cli
          if ! npx cap ls | grep -q "Capacitor"; then
            npx cap init "$APP_NAME" "$BUNDLE_ID" --web-dir="$WEB_DIR" --npm-client=npm --yes
          fi
          if [ ! -d ios ]; then
            npx cap add ios
          fi

      - name: Force bundle id in Capacitor config & Xcode project
        script: |
          # Update capacitor config (handles ts/json/js)
          for f in capacitor.config.ts capacitor.config.json capacitor.config.js; do
            [ -f "$f" ] || continue
            # appId in TS/JS
            sed -i '' "s/appId: *['\"][^'\"]*['\"]/appId: '$BUNDLE_ID'/g" "$f" || true
            # appId in JSON
            sed -i '' "s/\"appId\" *: *\"[^\"]*\"/\"appId\": \"$BUNDLE_ID\"/g" "$f" || true
          done
          # Sync and also set Info.plist + build settings
          npx cap sync ios
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $BUNDLE_ID" ios/App/App/Info.plist || true
          perl -pi -e "s/PRODUCT_BUNDLE_IDENTIFIER = [^;]*/PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID/g" ios/App/App.xcodeproj/project.pbxproj || true
          agvtool new-version -all ${BUILD_NUMBER:-1} || true

      - name: Use automatic signing profiles
        script: xcode-project use-profiles

      - name: Build IPA (workspace preferred, fallback to project)
        script: |
          if [ -f "ios/App/App.xcworkspace/contents.xcworkspacedata" ]; then
            echo "Building via workspace…"
            xcode-project build-ipa \
              --workspace "ios/App/App.xcworkspace" \
              --scheme "${IOS_SCHEME:-App}" \
              --archive-path "$CM_BUILD_DIR/ios_archive.xcarchive"
          else
            echo "Workspace not found, building via xcodeproj…"
            xcode-project build-ipa \
              --project "ios/App/App.xcodeproj" \
              --scheme "${IOS_SCHEME:-App}" \
              --archive-path "$CM_BUILD_DIR/ios_archive.xcarchive"
          fi

    artifacts:
      - build/ios/ipa/*.ipa
      - $CM_BUILD_DIR/ios_archive.xcarchive

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true