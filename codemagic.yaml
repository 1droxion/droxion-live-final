workflows:
  android-capacitor:
    name: Droxion Fit Android Play Bundle
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      android_signing:
        - droxion_android
      vars:
        APP_NAME: Droxion Fit
        PACKAGE_NAME: com.droxion.live
        ANDROID_VERSION_NAME: "1.7"
        ANDROID_VERSION_CODE_BASE: "170000"
        VITE_API_ORIGIN: https://www.droxion.com
        CM_CLONE_DEPTH: "20"
        HUSKY: "0"
        CI: "true"
      node: 22
      java: 21

    cache:
      cache_paths:
        - ~/.npm
        - ~/.gradle/caches
        - ~/.gradle/wrapper

    scripts:
      - name: Install dependencies
        script: |
          set -e
          npm config set audit false
          npm config set fund false
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund @capacitor/cli@7 @capacitor/android@7 @capacitor/assets@3.0.5

      - name: Build web app
        script: |
          set -e
          npm run build

      - name: Create Android project
        script: |
          set -e
          rm -rf android
          npx cap add android
          npx cap sync android
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Generate Droxion Fit Android icon
        script: |
          set -e
          npx @capacitor/assets generate --android             --assetPath assets             --iconBackgroundColor '#080a08'             --iconBackgroundColorDark '#080a08'             --splashBackgroundColor '#080a08'             --splashBackgroundColorDark '#080a08'

      - name: Configure Android release
        script: |
          set -e
          node scripts/configure-android-release.mjs --signing
          grep -q "android.permission.CAMERA" android/app/src/main/AndroidManifest.xml
          grep -q "com.android.vending.BILLING" android/app/src/main/AndroidManifest.xml
          ! grep -q "RECORD_AUDIO" android/app/src/main/AndroidManifest.xml
          ! grep -q "ACCESS_FINE_LOCATION" android/app/src/main/AndroidManifest.xml

      - name: Build signed Android bundle
        script: |
          set -e
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --stacktrace
          AAB="$(find app/build/outputs -name '*.aab' -print -quit)"
          test -n "$AAB"
          echo "Android AAB: $AAB"
          du -h "$AAB"

    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/mapping.txt

  ios-capacitor:
    name: Droxion Fit iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Droxion Codemagic

    environment:
      vars:
        APP_NAME: Droxion Fit
        BUNDLE_ID: com.droxion.live
        IOS_PROJECT_PATH: ios/App
        IOS_MARKETING_VERSION: "1.7"
        IOS_BUILD_NUMBER_BASE: "130000"
        VITE_API_ORIGIN: https://www.droxion.com
        CM_CLONE_DEPTH: "20"
        HUSKY: "0"
        CI: "true"
        COCOAPODS_DISABLE_STATS: "true"
      node: 22
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.droxion.live

    cache:
      cache_paths:
        - ~/.npm
        - ~/Library/Caches/CocoaPods
        - $HOME/Library/Developer/Xcode/DerivedData

    scripts:
      - name: Install dependencies
        script: |
          set -e
          npm config set audit false
          npm config set fund false
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund @capacitor/cli@7 @capacitor/ios@7 @capacitor/assets@3.0.5 @capgo/native-purchases@7.16.0

      - name: Build web app
        script: |
          set -e
          npm run build

      - name: Create iOS project
        script: |
          set -e
          rm -rf ios
          npx cap add ios
          npx cap sync ios
          sed -i '' "s/platform :ios, '[^']*'/platform :ios, '15.0'/" "$IOS_PROJECT_PATH/Podfile"

      - name: Generate Droxion Fit iOS icon
        script: |
          set -e
          npx @capacitor/assets generate --ios             --assetPath assets             --iconBackgroundColor '#080a08'             --iconBackgroundColorDark '#080a08'             --splashBackgroundColor '#080a08'             --splashBackgroundColorDark '#080a08'

      - name: Configure iOS app metadata
        script: |
          set -e
          PLIST="$IOS_PROJECT_PATH/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName $APP_NAME" "$PLIST" || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string $APP_NAME" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :NSCameraUsageDescription Droxion Fit uses your camera to scan meal photos and estimate nutrition." "$PLIST" || /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string Droxion Fit uses your camera to scan meal photos and estimate nutrition." "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryUsageDescription Droxion Fit lets you choose meal photos from your library for nutrition estimates." "$PLIST" || /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string Droxion Fit lets you choose meal photos from your library for nutrition estimates." "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST" || /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST"
          ! /usr/libexec/PlistBuddy -c "Print :NSMicrophoneUsageDescription" "$PLIST" >/dev/null 2>&1
          ! /usr/libexec/PlistBuddy -c "Print :NSLocationWhenInUseUsageDescription" "$PLIST" >/dev/null 2>&1

      - name: Install CocoaPods
        script: |
          set -e
          cd "$IOS_PROJECT_PATH"
          pod install --repo-update

      - name: Apply signing profiles
        script: |
          set -e
          xcode-project use-profiles --project "$IOS_PROJECT_PATH/App.xcodeproj" || xcode-project use-profiles

      - name: Set iOS version
        script: |
          set -e
          cd "$IOS_PROJECT_PATH"
          IOS_BUILD_NUMBER=$((IOS_BUILD_NUMBER_BASE + BUILD_NUMBER))
          agvtool new-marketing-version "$IOS_MARKETING_VERSION"
          agvtool new-version -all "$IOS_BUILD_NUMBER"
          echo "Droxion Fit iOS $IOS_MARKETING_VERSION ($IOS_BUILD_NUMBER)"

      - name: Build signed IPA
        script: |
          set -e
          cd "$IOS_PROJECT_PATH"
          xcode-project build-ipa             --workspace "App.xcworkspace"             --scheme "App"
          test -n "$(find build/ios/ipa -name '*.ipa' -print -quit)"

    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - build/ios/ipa/*.ipa
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
