workflows:
  ios-capacitor:
    name: Droxion iOS Build
    max_build_duration: 60

    environment:
      groups:
        - codemagic.yaml            # imports APP_STORE_CONNECT_* vars from UI
      vars:
        APP_NAME: Droxion
        BUNDLE_ID: com.droxion.app
        WEB_DIR: dist
      node: 20
      xcode: 15.4
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.droxion.app

    cache:
      cache_paths:
        - ~/.npm
        - ~/Library/Caches/CocoaPods
        - $CM_BUILD_DIR/ios/Pods

    scripts:
      - name: Show versions
        script: |
          set -e
          echo "Node: $(node -v)"
          echo "npm : $(npm -v)"
          echo "CocoaPods: $(pod --version)"
          xcodebuild -version

      # Clean install (keep optional deps so rollup/vite natives are present)
      - name: Install dependencies (fresh lock; include optional deps)
        script: |
          set -e
          rm -rf node_modules package-lock.json
          unset npm_config_optional || true
          unset npm_config_omit || true
          printf "fund=false\naudit=false\n" > .npmrc
          echo "→ npm install (recreate package-lock.json with optional deps)"
          npm install --include=optional --no-audit --no-fund

      - name: Build web app
        script: |
          set -e
          npm run build

      - name: Generate iOS project (Capacitor)
        script: |
          set -e
          npm i -D @capacitor/cli
          npm i @capacitor/core @capacitor/ios

          echo "→ Ensure capacitor.config.json exists"
          if [ ! -f capacitor.config.json ]; then
            node -e 'const fs=require("fs");const e=process.env;
              const id=(e.BUNDLE_ID&&e.BUNDLE_ID.includes("."))?e.BUNDLE_ID:"com.droxion.app";
              const name=e.APP_NAME||"Droxion";
              const web=e.WEB_DIR||"dist";
              const json={appId:id,appName:name,webDir:web,bundledWebRuntime:false};
              fs.writeFileSync("capacitor.config.json",JSON.stringify(json,null,2));'
          fi
          cat capacitor.config.json

          echo "→ Add/sync iOS platform"
          [ -d ios ] || npx cap add ios
          npx cap copy ios
          npx cap sync ios

          echo "→ Add iOS privacy strings"
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string Camera is used to take photos for chat." ios/App/App/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string Microphone is used for voice input." ios/App/App/Info.plist || true

      - name: Install CocoaPods
        script: |
          set -e
          if [ -d ios/App ]; then cd ios/App; elif [ -d ios ]; then cd ios; else echo "❌ ios folder missing"; exit 1; fi
          pod install --repo-update

      - name: Apply provisioning profiles (Automatic signing)
        script: |
          set -e
          cd ios/App
          xcode-project use-profiles

      # Early PEM sanity check
      - name: Validate App Store Connect key format
        script: |
          set -e
          echo "Key ID: ${APP_STORE_CONNECT_KEY_ID:-MISSING}"
          echo "Issuer: ${APP_STORE_CONNECT_ISSUER_ID:-MISSING}"
          echo "First line:" ; echo "${APP_STORE_CONNECT_API_KEY}" | head -n1
          echo "Last  line:" ; echo "${APP_STORE_CONNECT_API_KEY}" | tail -n1
          FIRST="$(echo "${APP_STORE_CONNECT_API_KEY}" | head -n1)"
          LAST="$(echo  "${APP_STORE_CONNECT_API_KEY}" | tail -n1)"
          if [ "$FIRST" != "-----BEGIN PRIVATE KEY-----" ] || [ "$LAST" != "-----END PRIVATE KEY-----" ]; then
            echo "❌ APP_STORE_CONNECT_API_KEY is not a multiline PEM. Re-add it as the full .p8 contents."
            exit 1
          fi
          echo "✅ Key looks like a proper PEM."

      # Increase CFBundleVersion every upload
      - name: Bump build number (required for upload)
        script: |
          set -e
          BUILD_NO=${CM_BUILD_ID:-$(date +%Y%m%d%H%M%S)}
          echo "Using build number: $BUILD_NO"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NO" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool NO" ios/App/App/Info.plist || true
          /usr/libexec/PlistBuddy -c "Print" ios/App/App/Info.plist | head -n 50

      - name: Build IPA
        script: |
          set -e
          xcode-project build-ipa \
            --workspace "ios/App/App.xcworkspace" \
            --scheme "App"

      # Upload to TestFlight using Fastlane Pilot (API key JSON built inline)
      - name: Upload IPA to TestFlight (fastlane pilot)
        script: |
          set -e
          IPA_PATH="build/ios/ipa/App.ipa"
          if [ ! -f "$IPA_PATH" ]; then
            echo "❌ IPA not found at $IPA_PATH"
            ls -R build/ios/ipa || true
            exit 1
          fi

          echo "→ Building api_key.json for fastlane (properly escaped)"
          ESCAPED_PEM=$(printf '%s' "$APP_STORE_CONNECT_API_KEY" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')
          printf '{"key_id":"%s","issuer_id":"%s","key":%s,"in_house":false}\n' \
            "$APP_STORE_CONNECT_KEY_ID" "$APP_STORE_CONNECT_ISSUER_ID" "$ESCAPED_PEM" > api_key.json
          echo "api_key.json created"

          echo "→ Installing fastlane (if needed)"
          gem list -i fastlane || sudo gem install fastlane --no-document

          PROVIDER_ARGS=()
          if [ -n "$APP_STORE_CONNECT_PROVIDER" ]; then
            echo "→ Using provider: $APP_STORE_CONNECT_PROVIDER"
            PROVIDER_ARGS+=(--itc_provider "$APP_STORE_CONNECT_PROVIDER")
          fi

          echo "→ Uploading to TestFlight with fastlane pilot"
          fastlane pilot upload \
            --ipa "$IPA_PATH" \
            --api_key_path api_key.json \
            --skip_submission true \
            --skip_waiting_for_build_processing true \
            "${PROVIDER_ARGS[@]}" \
            --verbose

    artifacts:
      - build/ios/ipa/*.ipa
      - ~/Library/Developer/Xcode/DerivedData/**/Build/**/*.log
