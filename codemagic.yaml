      - name: Upload IPA to TestFlight (Codemagic publisher)
        script: |
          set -e
          IPA_PATH="build/ios/ipa/App.ipa"
          if [ ! -f "$IPA_PATH" ]; then
            echo "❌ IPA not found at $IPA_PATH"
            ls -R build/ios/ipa || true
            exit 1
          fi

          PROVIDER_ARGS=()
          if [ -n "$APP_STORE_CONNECT_PROVIDER" ]; then
            echo "→ Using provider: $APP_STORE_CONNECT_PROVIDER"
            PROVIDER_ARGS+=(--provider "$APP_STORE_CONNECT_PROVIDER")
          fi

          echo "→ Publishing to TestFlight via Codemagic App Store Connect (kebab-case flags)"
          # Try modern/kebab-case flags + explicit --file
          if ! app-store-connect publish \
                --key-id "$APP_STORE_CONNECT_KEY_ID" \
                --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
                --private-key @env:APP_STORE_CONNECT_API_KEY \
                --file "$IPA_PATH" \
                --submit-to-testflight \
                --skip-waiting-for-processing \
                "${PROVIDER_ARGS[@]}"; then
            echo "→ Retry with positional IPA path syntax"
            # Some CLI versions expect the IPA as a positional arg instead of --file
            app-store-connect publish \
              "$IPA_PATH" \
              --key-id "$APP_STORE_CONNECT_KEY_ID" \
              --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
              --private-key @env:APP_STORE_CONNECT_API_KEY \
              --submit-to-testflight \
              --skip-waiting-for-processing \
              "${PROVIDER_ARGS[@]}"
          fi
