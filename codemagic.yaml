workflows:
  ios-capacitor:
    name: Droxion iOS Build
    max_build_duration: 60

    # M2 host with Xcode 15.x is fastest/stable
    instance_type: mac_mini_m2

    environment:
      vars:
        # ---------- App vars ----------
        APP_NAME: Droxion
        BUNDLE_ID: com.droxion.app
        WEB_DIR: dist
        IOS_PROJECT_PATH: ios/App

        # ---------- Speed knobs ----------
        CM_CLONE_DEPTH: "1"               # ✅ shallow clone to speed "Fetching app sources"
        GIT_LFS_SKIP_SMUDGE: "1"          # ✅ don't pull large LFS blobs on checkout
        COCOAPODS_DISABLE_STATS: "true"   # ✅ faster pods
        HUSKY: "0"                        # ✅ skip git hooks if repo uses husky
        CI: "true"
      node: 20
      xcode: 15.4
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.droxion.app

    cache:
      cache_paths:
        - ~/.npm
        - ~/Library/Caches/CocoaPods
        - $HOME/Library/Developer/Xcode/DerivedData

    scripts:
      - name: Show tools
        script: |
          set -e
          node -v
          npm -v
          xcodebuild -version
          pod --version || true
          git --version
          echo "Clone depth: ${CM_CLONE_DEPTH:-full}"

      - name: Speed up npm config
        script: |
          npm config set prefer-offline true
          npm config set audit false
          npm config set fund false
          npm config set progress false
          npm config set fetch-retries 5
          npm config set fetch-timeout 600000

      - name: Install dependencies (handle rollup optional binaries)
        script: |
          set -e
          # Try reproducible install; if lock is out-of-sync, fall back once
          npm ci --omit=optional || (rm -rf node_modules package-lock.json && npm install --omit=optional)

      - name: Build web app
        script: npm run build

      - name: Sync Capacitor iOS
        script: npx cap sync ios

      - name: Install CocoaPods (fast, using CDN)
        script: |
          set -e
          cd "$IOS_PROJECT_PATH"
          # Using --repo-update hits CDN; no need for 'pod repo update' (slow)
          pod install --repo-update --silent

      - name: Configure signing (from Codemagic)
        script: |
          set -e
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Increment build number
        script: |
          set -e
          cd "$IOS_PROJECT_PATH"
          agvtool new-version -all $(date +%s)

      - name: Build IPA
        script: |
          set -e
          xcode-project build-ipa \
            --workspace "$IOS_PROJECT_PATH/App.xcworkspace" \
            --scheme "App"

    artifacts:
      - $CM_EXPORT_DIR/*.ipa
      - $CM_EXPORT_DIR/*.dSYM.zip
      - $CM_EXPORT_DIR/*.xcarchive

    # Optional: turn on to push straight to TestFlight after build
    # publishing:
    #   app_store_connect:
    #     auth: api_key
    #     api_key: $APP_STORE_CONNECT_API_KEY_JSON
    #     submit_to_testflight: true
    #     beta_groups:
    #       - Internal Testers