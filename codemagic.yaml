workflows:
  ios-capacitor:
    name: Droxion iOS Build
    max_build_duration: 60

    environment:
      node: 20
      xcode: 15.4
      cocoapods: default
      vars:
        APP_NAME: Droxion
        BUNDLE_ID: com.droxion.app
        WEB_DIR: dist
        NPM_CONFIG_PREFER_OFFLINE: "true"
        NPM_CONFIG_AUDIT: "false"
        NPM_CONFIG_FUND: "false"
        NPM_CONFIG_CACHE: "~/.npm"
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.droxion.app

    cache:
      cache_paths:
        - ~/.npm
        - $CM_BUILD_DIR/ios/Pods
        - ~/Library/Caches/CocoaPods

    scripts:
      - name: Show versions
        script: |
          set -e
          node -v
          npm -v
          pod --version
          xcodebuild -version

      - name: Install dependencies (fast; prefer offline; keep optional deps)
        script: |
          set -e
          echo "→ npm ci (prefer-offline)"
          if npm ci --prefer-offline --no-audit --no-fund; then
            echo "✓ npm ci succeeded"
          else
            echo "⚠ npm ci failed — fallback to clean install"
            rm -rf node_modules
            mv package-lock.json package-lock.ci.bak || true
            npm config set legacy-peer-deps true
            npm install --legacy-peer-deps --prefer-offline --no-audit --no-fund
          fi

      - name: Build web app
        script: |
          set -e
          npm rebuild rollup -f || true
          npm run build

      - name: Generate iOS project (Capacitor)
        script: |
          set -e
          npm i -D @capacitor/cli
          npm i @capacitor/core @capacitor/ios

          echo "→ Ensuring capacitor.config.json exists (from env)"
          if [ ! -f capacitor.config.json ]; then
            node -e 'const fs=require("fs"); const e=process.env;
              const id = (e.BUNDLE_ID && e.BUNDLE_ID.includes(".")) ? e.BUNDLE_ID : "com.droxion.app";
              const name = e.APP_NAME || "Droxion";
              const web = e.WEB_DIR || "dist";
              const json = { appId:id, appName:name, webDir:web, bundledWebRuntime:false };
              fs.writeFileSync("capacitor.config.json", JSON.stringify(json,null,2));'
          fi
          cat capacitor.config.json

          echo "→ Add iOS platform if missing"
          if [ ! -d ios ]; then
            npx cap add ios
          fi

          echo "→ Sync Capacitor"
          npx cap copy ios
          npx cap sync ios

          echo "→ Verify ios/App exists"
          ls -la ios || true
          ls -la ios/App || true
          if [ ! -d ios/App ]; then
            echo "❌ ios/App not found — failing"
            exit 1
          fi

          echo "→ iOS privacy strings"
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string Camera is used to take photos for chat." ios/App/App/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string Microphone is used for voice input." ios/App/App/Info.plist || true

      - name: Install CocoaPods
        script: |
          set -e
          if [ -d ios/App ]; then
            cd ios/App
          elif [ -d ios ]; then
            cd ios
          else
            echo "❌ iOS project folder not found."
            exit 1
          fi
          pod install --repo-update

      - name: Bump build number
        script: |
          set -e
          if [ -d ios/App ]; then cd ios/App; else cd ios; fi
          agvtool new-version -all "$BUILD_NUMBER" || true

      # 👉 NEW: force Automatic signing + set your Development Team
      - name: Fix code signing in Xcode project
        script: |
          set -e
          PROJ="ios/App/App.xcodeproj/project.pbxproj"
          echo "→ Patching $PROJ to Automatic signing"
          # Switch Manual → Automatic
          /usr/bin/sed -i '' -e 's/CODE_SIGN_STYLE = Manual;/CODE_SIGN_STYLE = Automatic;/g' "$PROJ"
          # Remove any stale profile specifiers that force Manual
          /usr/bin/sed -i '' -e '/PROVISIONING_PROFILE_SPECIFIER/d' "$PROJ"
          /usr/bin/sed -i '' -e '/PROVISIONING_PROFILE = /d' "$PROJ"
          # Inject your Apple Team ID everywhere (uses the one you already set in Codemagic)
          if [ -n "$APP_STORE_CONNECT_TEAM_ID" ]; then
            /usr/bin/sed -i '' -E "s/DEVELOPMENT_TEAM = [A-Z0-9]+;/DEVELOPMENT_TEAM = ${APP_STORE_CONNECT_TEAM_ID};/g" "$PROJ"
            # in case the field is empty or missing, add a line next to CODE_SIGN_STYLE
            /usr/bin/sed -i '' -E "s/(CODE_SIGN_STYLE = Automatic;)/\\1\n\t\t\t\tDEVELOPMENT_TEAM = ${APP_STORE_CONNECT_TEAM_ID};/g" "$PROJ"
          fi
          echo "→ Done patching code signing."

      - name: Build IPA
        script: |
          set -e
          # Create export options plist for App Store automatic signing
          cat > "$HOME/export_options.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>compileBitcode</key><false/>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>automatic</string>
            <key>stripSwiftSymbols</key><true/>
          </dict>
          </plist>
          PLIST

          echo "→ Using export options plist at $HOME/export_options.plist"
          xcode-project build-ipa \
            --workspace "ios/App/App.xcworkspace" \
            --scheme "App" \
            --export-options-plist "$HOME/export_options.plist"

    artifacts:
      - build/ios/ipa/*.ipa
      - ~/Library/Developer/Xcode/DerivedData/**/Build/**/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_API_KEY
        key_id: $APP_STORE_CONNECT_KEY_ID
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false
