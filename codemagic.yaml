workflows:
  ios-capacitor:
    name: Droxion iOS Build
    max_build_duration: 60

    instance_type: mac_mini_m2

    environment:
      vars:
        APP_NAME: Droxion
        BUNDLE_ID: com.droxion.app
        WEB_DIR: dist
        IOS_PROJECT_PATH: ios/App
        CM_CLONE_DEPTH: "1"
        GIT_LFS_SKIP_SMUDGE: "1"
        COCOAPODS_DISABLE_STATS: "true"
        HUSKY: "0"
        CI: "true"
      node: 20
      xcode: 15.4
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.droxion.app

    cache:
      cache_paths:
        - ~/.npm
        - ~/Library/Caches/CocoaPods
        - $HOME/Library/Developer/Xcode/DerivedData

    scripts:
      - name: Show tools
        script: |
          node -v
          npm -v
          xcodebuild -version
          pod --version || true
          git --version

      - name: Speed up npm config
        script: |
          npm config set prefer-offline true
          npm config set audit false
          npm config set fund false
          npm config set progress false
          npm config set fetch-retries 5
          npm config set fetch-timeout 600000

      - name: Install dependencies (force rollup darwin binary)
        script: |
          set -e
          npm ci || (rm -rf node_modules package-lock.json && npm install)
          # Ensure Rollup binary is present for Apple Silicon
          npm install @rollup/rollup-darwin-arm64 --save-dev --no-fund --no-audit

      - name: Build web app
        script: npm run build

      - name: Ensure Capacitor CLI & iOS, then Sync
        script: |
          set -e
          # Make sure Capacitor CLI exists
          if ! npx --yes @capacitor/cli --version >/dev/null 2>&1; then
            echo "Installing @capacitor/cli..."
            npm i -D @capacitor/cli
          fi
          # Make sure core is present
          if ! npm ls @capacitor/core >/dev/null 2>&1; then
            echo "Installing @capacitor/core..."
            npm i @capacitor/core
          fi
          # Make sure iOS platform exists
          if [ ! -d "ios" ]; then
            echo "Adding @capacitor/ios platform..."
            npm i @capacitor/ios
            npx --yes @capacitor/cli add ios
          fi
          # Sync iOS
          npx --yes @capacitor/cli sync ios

      - name: Install CocoaPods (fast, using CDN)
        script: |
          set -e
          cd "$IOS_PROJECT_PATH"
          pod install --repo-update --silent

      - name: Configure signing (from Codemagic)
        script: |
          set -e
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Increment build number
        script: |
          set -e
          cd "$IOS_PROJECT_PATH"
          agvtool new-version -all $(date +%s)

      - name: Build IPA
        script: |
          set -e
          xcode-project build-ipa \
            --workspace "$IOS_PROJECT_PATH/App.xcworkspace" \
            --scheme "App"

    artifacts:
      - $CM_EXPORT_DIR/*.ipa
      - $CM_EXPORT_DIR/*.dSYM.zip
      - $CM_EXPORT_DIR/*.xcarchive

    # Optional: enable to push straight to TestFlight after a successful build
    # publishing:
    #   app_store_connect:
    #     auth: api_key
    #     api_key: $APP_STORE_CONNECT_API_KEY_JSON
    #     submit_to_testflight: true
    #     beta_groups:
    #       - Internal Testers