workflows:
  ios-capacitor:
    name: Droxion iOS Build
    max_build_duration: 60

    environment:
      node: 20
      xcode: 15.4
      cocoapods: default
      vars:
        APP_NAME: Droxion
        BUNDLE_ID: com.droxion.app
        WEB_DIR: dist
        NPM_CONFIG_PREFER_OFFLINE: "true"
        NPM_CONFIG_AUDIT: "false"
        NPM_CONFIG_FUND: "false"
        NPM_CONFIG_CACHE: "~/.npm"
      ios_signing:
  distribution_type: app_store
  bundle_identifier: com.droxion.app
  provisioning_profile: droxion_appstore_profile

    cache:
      cache_paths:
        - ~/.npm
        - $CM_BUILD_DIR/ios/Pods
        - ~/Library/Caches/CocoaPods

    scripts:
      - name: Show versions
        script: |
          set -e
          node -v
          npm -v
          pod --version
          xcodebuild -version

      - name: Install dependencies (fast; prefer offline; keep optional deps)
        script: |
          set -e
          echo "→ npm ci (prefer-offline)"
          if npm ci --prefer-offline --no-audit --no-fund; then
            echo "✓ npm ci succeeded"
          else
            echo "⚠ npm ci failed — fallback to clean install"
            rm -rf node_modules
            mv package-lock.json package-lock.ci.bak || true
            npm config set legacy-peer-deps true
            npm install --legacy-peer-deps --prefer-offline --no-audit --no-fund
          fi

      - name: Build web app
        script: |
          set -e
          npm rebuild rollup -f || true
          npm run build

      - name: Generate iOS project (Capacitor)
        script: |
          set -e
          npm i -D @capacitor/cli
          npm i @capacitor/core @capacitor/ios

          echo "→ Ensuring capacitor.config.json exists (from env)"
          if [ ! -f capacitor.config.json ]; then
            node -e 'const fs=require("fs"); const e=process.env;
              const id = (e.BUNDLE_ID && e.BUNDLE_ID.includes(".")) ? e.BUNDLE_ID : "com.droxion.app";
              const name = e.APP_NAME || "Droxion";
              const web = e.WEB_DIR || "dist";
              const json = { appId:id, appName:name, webDir:web, bundledWebRuntime:false };
              fs.writeFileSync("capacitor.config.json", JSON.stringify(json,null,2));'
          fi
          cat capacitor.config.json

          echo "→ Add iOS platform if missing"
          if [ ! -d ios ]; then
            npx cap add ios
          fi

          echo "→ Sync Capacitor"
          npx cap copy ios
          npx cap sync ios

          echo "→ Verify ios/App exists"
          ls -la ios || true
          ls -la ios/App || true
          if [ ! -d ios/App ]; then
            echo "❌ ios/App not found — failing"
            exit 1
          fi

          echo "→ iOS privacy strings"
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string Camera is used to take photos for chat." ios/App/App/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string Microphone is used for voice input." ios/App/App/Info.plist || true

      - name: Install CocoaPods
        script: |
          set -e
          if [ -d ios/App ]; then
            cd ios/App
          elif [ -d ios ]; then
            cd ios
          else
            echo "❌ iOS project folder not found."
            exit 1
          fi
          pod install --repo-update

      - name: Bump build number
        script: |
          set -e
          if [ -d ios/App ]; then cd ios/App; else cd ios; fi
          agvtool new-version -all "$BUILD_NUMBER" || true

      # ✅ Apply Codemagic-managed provisioning profiles and automatic signing
      - name: Apply provisioning profiles (Automatic signing)
        script: |
          set -e
          # Run inside the iOS app directory; this command reads the workspace/project automatically.
          cd ios/App
          xcode-project use-profiles
          # show what was applied (optional)
          xcode-project show-build-settings | head -n 50 || true

            - name: Build IPA
        script: |
          set -e

          # 1) Detect the bundle id from config (fallback to env)
          BUNDLE_ID_FROM_CFG=$(node -e 'try{const f=require("fs");const j=JSON.parse(f.readFileSync("capacitor.config.json","utf8"));console.log(j.appId||"");}catch(e){console.log("")}')
          APP_BUNDLE_ID="${BUNDLE_ID_FROM_CFG:-$BUNDLE_ID}"
          if [[ -z "$APP_BUNDLE_ID" ]]; then
            echo "❌ Could not determine bundle id"; exit 1
          fi
          echo "→ Bundle ID: $APP_BUNDLE_ID"

          # 2) Find an installed App Store provisioning profile for this bundle id
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          MATCHED_PROFILE=""
          PROFILE_NAME=""
          TEAM_ID_DETECTED=""

          shopt -s nullglob
          for p in "$PROFILES_DIR"/*.mobileprovision; do
            XML=$(/usr/bin/security cms -D -i "$p" 2>/dev/null) || continue
            APP_ID=$(/usr/bin/plutil -extract Entitlements:application-identifier xml1 -o - - <<<"$XML" 2>/dev/null | /usr/bin/plutil -p - 2>/dev/null | /usr/bin/sed -E 's/^"([^"]+)".*$/\1/')
            NAME=$(/usr/bin/plutil -extract Name xml1 -o - - <<<"$XML" 2>/dev/null | /usr/bin/plutil -p - 2>/dev/null | /usr/bin/sed -E 's/^"([^"]+)".*$/\1/')
            METHOD=$(/usr/bin/plutil -extract ProvisionsAllDevices xml1 -o - - <<<"$XML" 2>/dev/null | /usr/bin/plutil -p - 2>/dev/null || echo "false")
            TEAM=$(/usr/bin/plutil -extract TeamIdentifier.0 xml1 -o - - <<<"$XML" 2>/dev/null | /usr/bin/plutil -p - 2>/dev/null | /usr/bin/sed -E 's/^"([^"]+)".*$/\1/')

            # App Store profile: ProvisionsAllDevices is false; application-identifier ends with the bundle id
            if [[ "$APP_ID" == *".$APP_BUNDLE_ID" ]]; then
              MATCHED_PROFILE="$p"
              PROFILE_NAME="$NAME"
              TEAM_ID_DETECTED="$TEAM"
              break
            fi
          done

          if [[ -z "$MATCHED_PROFILE" || -z "$PROFILE_NAME" ]]; then
            echo "❌ No installed provisioning profile found for $APP_BUNDLE_ID"
            echo "Make sure Codemagic Automatic signing is ON or upload an App Store provisioning profile for $APP_BUNDLE_ID."
            exit 1
          fi

          echo "→ Using provisioning profile:"
          echo "   Path : $MATCHED_PROFILE"
          echo "   Name : $PROFILE_NAME"
          echo "   Team : ${APP_STORE_CONNECT_TEAM_ID:-$TEAM_ID_DETECTED}"

          # 3) Write export options that point to that exact profile (manual = explicit mapping)
          cat > "$HOME/export_options.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>${APP_STORE_CONNECT_TEAM_ID:-$TEAM_ID_DETECTED}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$APP_BUNDLE_ID</key><string>$PROFILE_NAME</string>
            </dict>
            <key>compileBitcode</key><false/>
            <key>stripSwiftSymbols</key><true/>
            <key>destination</key><string>export</string>
          </dict>
          </plist>
          PLIST

          echo "→ Exporting IPA with explicit provisioning profile mapping"
          xcode-project build-ipa \
            --workspace "ios/App/App.xcworkspace" \
            --scheme "App" \
            --export-options-plist "$HOME/export_options.plist"
    artifacts:
      - build/ios/ipa/*.ipa
      - ~/Library/Developer/Xcode/DerivedData/**/Build/**/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_API_KEY
        key_id: $APP_STORE_CONNECT_KEY_ID
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false
