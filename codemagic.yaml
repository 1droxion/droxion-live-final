workflows:
  ios-capacitor:
    name: Droxion iOS Build
    max_build_duration: 60

    instance_type: mac_mini_m2        # use M2 machine with Xcode 15.x
    environment:
      vars:
        APP_NAME: Droxion
        BUNDLE_ID: com.droxion.app
        WEB_DIR: dist
        IOS_PROJECT_PATH: ios/App
      node: 20
      xcode: 15.4                    # ✅ stable Xcode version
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.droxion.app

    cache:
      cache_paths:
        - ~/.npm
        - ~/Library/Caches/CocoaPods

    scripts:
      - name: Show tools
        script: |
          node -v
          npm -v
          xcodebuild -version
          pod --version || true

      - name: Install dependencies
        script: npm ci

      - name: Build web app
        script: npm run build

      - name: Sync Capacitor iOS
        script: npx cap sync ios

      - name: Install CocoaPods
        script: |
          cd "$IOS_PROJECT_PATH"
          pod repo update
          pod install

      - name: Configure signing (from Codemagic)
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Increment build number
        script: |
          cd "$IOS_PROJECT_PATH"
          agvtool new-version -all $(date +%s)

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace "$IOS_PROJECT_PATH/App.xcworkspace" \
            --scheme "App"

    artifacts:
      - $CM_EXPORT_DIR/*.ipa
      - $CM_EXPORT_DIR/*.dSYM.zip
      - $CM_EXPORT_DIR/*.xcarchive