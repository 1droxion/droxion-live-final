workflows:
  ios-capacitor:
    name: Droxion iOS Build
    max_build_duration: 60

    environment:
      node: 20
      xcode: 15.4
      cocoapods: default
      vars:
        APP_NAME: Droxion
        BUNDLE_ID: com.droxion.app
        WEB_DIR: dist
        # Speed up npm by using cache aggressively (safe)
        NPM_CONFIG_PREFER_OFFLINE: "true"
        NPM_CONFIG_AUDIT: "false"
        NPM_CONFIG_FUND: "false"
        NPM_CONFIG_CACHE: "~/.npm"
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.droxion.app

    cache:
      cache_paths:
        - ~/.npm               # npm package cache (biggest speedup after first success)
        - $CM_BUILD_DIR/ios/Pods
        - ~/Library/Caches/CocoaPods

    scripts:
      - name: Show versions
        script: |
          node -v
          npm -v
          pod --version
          xcodebuild -version

      # Faster installs: prefer cached tarballs; robust fallback if lock is incompatible on CI
      - name: Install dependencies (fast; prefer offline; keep optional deps)
        script: |
          set -e
          echo "→ npm ci (prefer-offline, no audit/fund)"
          if npm ci --prefer-offline --no-audit --no-fund; then
            echo "✓ npm ci succeeded"
          else
            echo "⚠ npm ci failed — falling back to clean install with legacy peers"
            rm -rf node_modules
            mv package-lock.json package-lock.ci.bak || true
            npm config set legacy-peer-deps true
            npm install --legacy-peer-deps --prefer-offline --no-audit --no-fund
          fi

      - name: Build web app
        script: |
          # Ensure rollup binary is good even if cache reused an odd one
          npm rebuild rollup -f || true
          npm run build

      - name: Generate iOS project (Capacitor)
        script: |
          set -e
          npm i -D @capacitor/cli
          npm i @capacitor/core @capacitor/ios

          # Create minimal config if missing (idempotent)
          if [ ! -f capacitor.config.ts ] && [ ! -f capacitor.config.json ]; then
            cat > capacitor.config.ts <<EOF
            export default {
              appId: "${BUNDLE_ID}",
              appName: "${APP_NAME}",
              webDir: "${WEB_DIR}",
              bundledWebRuntime: false
            };
            EOF
          fi

          # Initialize if needed
          if ! npx cap doctor >/dev/null 2>&1; then
            npx cap init "${APP_NAME}" "${BUNDLE_ID}" --web-dir="${WEB_DIR}" --npm-client=npm
          fi

          # Add iOS if missing
          if [ ! -d ios ]; then
            npx cap add ios
          fi

          # Sync web + plugins
          npx cap copy ios
          npx cap sync ios

          # Verify expected structure
          test -d ios/App || (echo "❌ ios/App was not generated. Check Capacitor config." && exit 1)

          # iOS privacy strings (safe if already present)
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string Camera is used to take photos for chat." ios/App/App/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string Microphone is used for voice input." ios/App/App/Info.plist || true

      - name: Install CocoaPods
        script: |
          set -e
          if [ -d ios/App ]; then
            cd ios/App
          elif [ -d ios ]; then
            cd ios
          else
            echo "❌ iOS project folder not found."
            exit 1
          fi
          pod install --repo-update

      - name: Bump build number
        script: |
          if [ -d ios/App ]; then cd ios/App; else cd ios; fi
          agvtool new-version -all $BUILD_NUMBER || true

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace "ios/App/App.xcworkspace" \
            --scheme "App" \
            --archive-configuration Release \
            --archive-flags="-destination generic/platform=iOS" \
            --team-id "$APP_STORE_CONNECT_TEAM_ID"

    artifacts:
      - build/ios/ipa/*.ipa
      - ~/Library/Developer/Xcode/DerivedData/**/Build/**/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_API_KEY
        key_id: $APP_STORE_CONNECT_KEY_ID
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false
