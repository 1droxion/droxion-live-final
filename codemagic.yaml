workflows:
  ios-capacitor:
    name: Droxion iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      vars:
        APP_NAME: Droxion
        BUNDLE_ID: com.droxion.app
        WEB_DIR: dist
        IOS_PROJECT_PATH: ios/App
        # speed knobs
        CM_CLONE_DEPTH: "1"
        GIT_LFS_SKIP_SMUDGE: "1"
        COCOAPODS_DISABLE_STATS: "true"
        HUSKY: "0"
        CI: "true"
      node: 20
      xcode: 15.4
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.droxion.app   # must match the target’s bundle id

    cache:
      cache_paths:
        - ~/.npm
        - ~/Library/Caches/CocoaPods
        - $HOME/Library/Developer/Xcode/DerivedData

    scripts:
      - name: Show tools
        script: |
          node -v
          npm -v
          xcodebuild -version
          pod --version || true
          git --version

      - name: Speed up npm config
        script: |
          npm config set prefer-offline true
          npm config set audit false
          npm config set fund false
          npm config set progress false
          npm config set fetch-retries 5
          npm config set fetch-timeout 600000

      - name: Install dependencies (force rollup darwin binary)
        script: |
          set -e
          npm ci || (rm -rf node_modules package-lock.json && npm install)
          npm install @rollup/rollup-darwin-arm64 --save-dev --no-fund --no-audit

      - name: Build web app
        script: npm run build

      - name: Ensure Capacitor CLI & iOS, then Sync
        script: |
          set -e
          if ! npx --yes @capacitor/cli --version >/dev/null 2>&1; then
            npm i -D @capacitor/cli
          fi
          if ! npm ls @capacitor/core >/dev/null 2>&1; then
            npm i @capacitor/core
          fi
          if [ ! -d "ios" ]; then
            npm i @capacitor/ios
            npx --yes @capacitor/cli add ios
          fi
          # Ensure capacitor config has correct appId/appName/webDir (safe no-op if already correct)
          if [ -f capacitor.config.ts ]; then
            echo "capacitor.config.ts present (leave as is)."
          else
            cat > capacitor.config.json <<EOF
            {
              "appId": "${BUNDLE_ID}",
              "appName": "${APP_NAME}",
              "webDir": "${WEB_DIR}"
            }
EOF
          fi
          npx --yes @capacitor/cli sync ios

      - name: FORCE target bundle id to match (surgery)
        script: |
          set -e
          # For Capacitor iOS template the target is usually "App"
          TARGET_NAME="App"
          PROJECT_DIR="${IOS_PROJECT_PATH}"
          INFO_PLIST="${PROJECT_DIR}/${TARGET_NAME}/Info.plist"

          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier ${BUNDLE_ID}" "$INFO_PLIST" || \
          /usr/libexec/PlistBuddy -c "Add :CFBundleIdentifier string ${BUNDLE_ID}" "$INFO_PLIST" || true

          # Also set PRODUCT_BUNDLE_IDENTIFIER at build settings level to be safe
          /usr/libexec/PlistBuddy -c "Set :CFBundleName ${APP_NAME}" "$INFO_PLIST" || true

          echo "Ensured Info.plist CFBundleIdentifier=${BUNDLE_ID}"

      - name: Install CocoaPods (fast, using CDN)
        script: |
          set -e
          cd "$IOS_PROJECT_PATH"
          pod install --repo-update --silent

      - name: Configure signing (from Codemagic)
        script: |
          set -e
          keychain initialize
          # Fetch or create profiles for our BUNDLE_ID (requires App Store Connect API key in Codemagic)
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          # Apply the fetched profiles to the Xcode project
          xcode-project use-profiles --project "$IOS_PROJECT_PATH/App.xcodeproj" || xcode-project use-profiles

      - name: Increment build number
        script: |
          set -e
          cd "$IOS_PROJECT_PATH"
          agvtool new-version -all $(date +%s)

      - name: Build IPA
        script: |
          set -e
          xcode-project build-ipa \
            --workspace "$IOS_PROJECT_PATH/App.xcworkspace" \
            --scheme "App"

    artifacts:
      - $CM_EXPORT_DIR/*.ipa
      - $CM_EXPORT_DIR/*.dSYM.zip
      - $CM_EXPORT_DIR/*.xcarchive

    # Uncomment to auto-upload to TestFlight after a successful build
    # publishing:
    #   app_store_connect:
    #     auth: api_key
    #     api_key: $APP_STORE_CONNECT_API_KEY_JSON
    #     submit_to_testflight: true
    #     beta_groups:
    #       - Internal Testers