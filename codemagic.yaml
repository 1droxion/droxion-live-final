workflows:
  ios-capacitor:
    name: Droxion iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m4

    integrations:
      app_store_connect: codemagic_key   # <-- replace with the name you used in Codemagic Integrations

    environment:
      groups:
        - Add    # group with APP_NAME, BUNDLE_ID, WEB_DIR
      xcode: 15.4
      node: 20
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: $BUNDLE_ID

    cache:
      cache_paths:
        - ~/.npm
        - ~/Library/Caches/CocoaPods
        - ios/Pods

    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Build web app
        script: npm run build

      - name: Ensure Capacitor iOS project exists
        script: |
          npm i -D @capacitor/cli
          if ! npx cap ls | grep -q "Capacitor"; then
            npx cap init "$APP_NAME" "$BUNDLE_ID" --web-dir="$WEB_DIR" --npm-client=npm --yes
          fi
          if [ ! -d ios ]; then
            npx cap add ios
          fi

      - name: Sync web build into iOS project
        script: |
          npx cap sync ios
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $BUNDLE_ID" ios/App/App/Info.plist || true
          agvtool new-version -all ${BUILD_NUMBER:-1} || true

      - name: Use automatic signing profiles
        script: xcode-project use-profiles

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "ios/App/App.xcodeproj" \
            --scheme "${IOS_SCHEME:-App}" \
            --archive-path "$CM_BUILD_DIR/ios_archive.xcarchive"

    artifacts:
      - build/ios/ipa/*.ipa
      - $CM_BUILD_DIR/ios_archive.xcarchive

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true