workflows:
  ios-capacitor:
    name: Droxion iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m1       # ✅ Switch to M1 instance for widest Xcode support

    environment:
      groups:
        - Add
      vars:
        APP_NAME: ${APP_NAME:-Droxion}
        WEB_DIR: ${WEB_DIR:-dist}
      xcode: 15.2                   # ✅ Stable version available on all M1 instances
      node: 20
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.droxion.app  # Hardcoded for now

    cache:
      cache_paths:
        - ~/.npm
        - ~/Library/Caches/CocoaPods
        - ios/Pods

    scripts:
      - name: Sanity check env
        script: |
          echo "APP_NAME=$APP_NAME"
          echo "WEB_DIR=$WEB_DIR"

      - name: Install dependencies
        script: npm ci

      - name: Build web app
        script: npm run build

      - name: Ensure Capacitor iOS project exists
        script: |
          npm i -D @capacitor/cli
          if ! npx cap ls | grep -q "Capacitor"; then
            npx cap init "$APP_NAME" "com.droxion.app" --web-dir="$WEB_DIR" --npm-client=npm --yes
          fi
          if [ ! -d ios ]; then
            npx cap add ios
          fi

      - name: Sync + force bundle id
        script: |
          npx cap sync ios
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier com.droxion.app" ios/App/App/Info.plist || true
          perl -pi -e "s/PRODUCT_BUNDLE_IDENTIFIER = [^;]*/PRODUCT_BUNDLE_IDENTIFIER = com.droxion.app/g" \
            ios/App/App.xcodeproj/project.pbxproj || true
          agvtool new-version -all ${BUILD_NUMBER:-1} || true

      - name: Use automatic signing profiles
        script: xcode-project use-profiles

      - name: Build IPA
        script: |
          if [ -f "ios/App/App.xcworkspace/contents.xcworkspacedata" ]; then
            xcode-project build-ipa \
              --workspace "ios/App/App.xcworkspace" \
              --scheme "${IOS_SCHEME:-App}" \
              --archive-path "$CM_BUILD_DIR/ios_archive.xcarchive"
          else
            xcode-project build-ipa \
              --project "ios/App/App.xcodeproj" \
              --scheme "${IOS_SCHEME:-App}" \
              --archive-path "$CM_BUILD_DIR/ios_archive.xcarchive"
          fi

    artifacts:
      - build/ios/ipa/*.ipa
      - $CM_BUILD_DIR/ios_archive.xcarchive

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true