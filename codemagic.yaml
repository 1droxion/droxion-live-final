workflows:
  ios-capacitor:
    name: Droxion iOS Build
    max_build_duration: 60

    environment:
      vars:
        APP_NAME: Droxion
        BUNDLE_ID: com.droxion.app
        WEB_DIR: dist
        # Optional: helps when peer deps cause failures
        NPM_CONFIG_LEGACY_PEER_DEPS: "true"
      node: 18          # <- more compatible than 20 for many npm deps
      xcode: 15.4
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.droxion.app

    cache:
      cache_paths:
        - ~/.npm
        - ~/Library/Caches/CocoaPods

    scripts:
      - name: Install JS dependencies
        script: |
          npm ci || npm install --no-audit --no-fund

      - name: Build web app
        script: npm run build

      - name: Sync Capacitor iOS
        script: |
          # Make sure Capacitor CLI is available (lightweight dev dep install)
          npm i -D @capacitor/cli
          # Sync (do NOT re-init or re-add ios each build)
          npx cap sync ios

      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install --repo-update
          cd ../../

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace "ios/App/App.xcworkspace" \
            --scheme "App" \
            --archive-flags="-destination 'generic/platform=iOS'" \
            --team-id "$APP_STORE_CONNECT_TEAM_ID"

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_API_KEY
        key_id: $APP_STORE_CONNECT_KEY_ID
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false
