workflows:
  ios-capacitor:
    name: Droxion iOS Build
    max_build_duration: 60

    environment:
      node: 20
      xcode: 15.4
      cocoapods: default
      vars:
        APP_NAME: Droxion
        BUNDLE_ID: com.droxion.app
        WEB_DIR: dist
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.droxion.app

    cache:
      cache_paths:
        - ~/.npm
        - ~/Library/Caches/CocoaPods
        - $CM_BUILD_DIR/ios/Pods

    scripts:
      - name: Show versions
        script: |
          node -v
          npm -v
          pod --version
          xcodebuild -version

      # ⚙️ Install with fallback. We DO NOT skip optional deps so rollup native gets installed.
      - name: Install dependencies (robust; keep optional deps)
        script: |
          set -e
          echo "→ npm ci (with optional deps)"
          if npm ci --no-audit --no-fund; then
            echo "✓ npm ci succeeded"
          else
            echo "⚠ npm ci failed — falling back"
            rm -rf node_modules
            # If lockfile is incompatible on CI, drop it only for this build to let npm resolve properly.
            mv package-lock.json package-lock.ci.bak || true
            npm config set legacy-peer-deps true
            npm config set audit false
            npm config set fund false
            npm install --legacy-peer-deps
          fi

      - name: Build web app
        script: |
          # Ensure rollup binary is healthy even if npm reused a cached one
          npm rebuild rollup -f || true
          npm run build

      - name: Generate iOS project (Capacitor)
        script: |
          npm i -D @capacitor/cli
          npm i @capacitor/core @capacitor/ios
          npx cap init "$APP_NAME" "$BUNDLE_ID" --web-dir="$WEB_DIR" --npm-client=npm --skip-dependencies || true
          npx cap add ios || true
          npx cap copy ios
          npx cap sync ios
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string Camera is used to take photos for chat." ios/App/App/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string Microphone is used for voice input." ios/App/App/Info.plist || true

      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install --repo-update

      - name: Bump build number
        script: |
          cd ios/App
          agvtool new-version -all $BUILD_NUMBER || true

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace "ios/App/App.xcworkspace" \
            --scheme "App" \
            --archive-configuration Release \
            --archive-flags="-destination generic/platform=iOS" \
            --team-id "$APP_STORE_CONNECT_TEAM_ID"

    artifacts:
      - build/ios/ipa/*.ipa
      - ~/Library/Developer/Xcode/DerivedData/**/Build/**/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_API_KEY
        key_id: $APP_STORE_CONNECT_KEY_ID
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false
