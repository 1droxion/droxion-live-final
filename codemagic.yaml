workflows:
  ios-capacitor:
    name: Droxion iOS Build
    max_build_duration: 60

    instance_type: mac_mini_m2
    environment:
      vars:
        APP_NAME: Droxion
        BUNDLE_ID: com.droxion.app
        WEB_DIR: dist
        IOS_PROJECT_PATH: ios/App
        CM_CLONE_DEPTH: "1"
        GIT_LFS_SKIP_SMUDGE: "1"
        COCOAPODS_DISABLE_STATS: "true"
        HUSKY: "0"
        CI: "true"
      node: 20
      xcode: 15.4
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.droxion.app

    cache:
      cache_paths:
        - ~/.npm
        - ~/Library/Caches/CocoaPods
        - $HOME/Library/Developer/Xcode/DerivedData

    scripts:
      - name: Show tools
        script: |
          node -v
          npm -v
          xcodebuild -version
          pod --version || true

      - name: Speed up npm config
        script: |
          npm config set prefer-offline true
          npm config set audit false
          npm config set fund false
          npm config set progress false
          npm config set fetch-retries 5
          npm config set fetch-timeout 600000

      - name: Install dependencies (force rollup darwin binary)
        script: |
          set -e
          npm ci || (rm -rf node_modules package-lock.json && npm install)
          # ✅ Force install the darwin-arm64 rollup binary for Apple Silicon
          npm install @rollup/rollup-darwin-arm64 --save-dev --no-fund --no-audit

      - name: Build web app
        script: npm run build

      - name: Sync Capacitor iOS
        script: npx cap sync ios

      - name: Install CocoaPods (fast, using CDN)
        script: |
          cd "$IOS_PROJECT_PATH"
          pod install --repo-update --silent

      - name: Configure signing (from Codemagic)
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Increment build number
        script: |
          cd "$IOS_PROJECT_PATH"
          agvtool new-version -all $(date +%s)

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace "$IOS_PROJECT_PATH/App.xcworkspace" \
            --scheme "App"

    artifacts:
      - $CM_EXPORT_DIR/*.ipa
      - $CM_EXPORT_DIR/*.dSYM.zip
      - $CM_EXPORT_DIR/*.xcarchive