workflows:
  ios-capacitor:
    name: Droxion iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m4

    environment:
      groups:
        - Add                 # your group with build vars + (optionally) ASC vars
      vars:                   # safe defaults so YAML validates even if group not loaded
        APP_NAME: Droxion
        BUNDLE_ID: com.droxion.app
        WEB_DIR: dist
      xcode: 15.4
      node: 20
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: $BUNDLE_ID

    cache:
      cache_paths:
        - ~/.npm
        - ~/Library/Caches/CocoaPods
        - ios/Pods

    scripts:
      - name: Sanity check env
        script: |
          echo "APP_NAME=$APP_NAME"
          echo "BUNDLE_ID=$BUNDLE_ID"
          echo "WEB_DIR=$WEB_DIR"
          test -n "$APP_NAME" && test -n "$BUNDLE_ID" && test -n "$WEB_DIR"

      - name: Install dependencies
        script: npm ci

      - name: Build web app
        script: npm run build

      - name: Ensure Capacitor iOS project exists
        script: |
          npm i -D @capacitor/cli
          if ! npx cap ls | grep -q "Capacitor"; then
            npx cap init "$APP_NAME" "$BUNDLE_ID" --web-dir="$WEB_DIR" --npm-client=npm --yes
          fi
          if [ ! -d ios ]; then
            npx cap add ios
          fi

      - name: Force bundle id and sync
        script: |
          # Update capacitor config (ts/json/js)
          for f in capacitor.config.ts capacitor.config.json capacitor.config.js; do
            [ -f "$f" ] || continue
            sed -i '' "s/appId: *['\"][^'\"]*['\"]/appId: '$BUNDLE_ID'/g" "$f" || true
            sed -i '' "s/\"appId\" *: *\"[^\"]*\"/\"appId\": \"$BUNDLE_ID\"/g" "$f" || true
          done
          npx cap sync ios
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $BUNDLE_ID" ios/App/App/Info.plist || true
          perl -pi -e "s/PRODUCT_BUNDLE_IDENTIFIER = [^;]*/PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID/g" ios/App/App.xcodeproj/project.pbxproj || true
          agvtool new-version -all ${BUILD_NUMBER:-1} || true

      - name: Use automatic signing profiles
        script: xcode-project use-profiles

      - name: Build IPA (workspace preferred)
        script: |
          if [ -f "ios/App/App.xcworkspace/contents.xcworkspacedata" ]; then
            xcode-project build-ipa \
              --workspace "ios/App/App.xcworkspace" \
              --scheme "${IOS_SCHEME:-App}" \
              --archive-path "$CM_BUILD_DIR/ios_archive.xcarchive"
          else
            xcode-project build-ipa \
              --project "ios/App/App.xcodeproj" \
              --scheme "${IOS_SCHEME:-App}" \
              --archive-path "$CM_BUILD_DIR/ios_archive.xcarchive"
          fi

    artifacts:
      - build/ios/ipa/*.ipa
      - $CM_BUILD_DIR/ios_archive.xcarchive

    publishing:
      app_store_connect:
        # use env vars (no integration name required)
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true